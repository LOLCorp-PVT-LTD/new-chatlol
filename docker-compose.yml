# Full ChatLOL stack: MongoDB (single-node replica set), Redis, 2× API, web (nginx). Optional coturn with `--profile turn`.
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#   docker compose --profile turn up -d   # if you want the bundled coturn instead of your own TURN server
services:
  # A one-member replica set, so the API can use multi-document transactions.
  # Not published to the host; only the API containers reach it. For managed hosting, use MongoDB Atlas instead.
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes: [mongodata:/data/db]
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once this node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      start_period: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    image: chatlol-api
    deploy: { replicas: 2 }
    env_file: [.env]
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017/chatlol?replicaSet=rs0}
      REDIS_URL: redis://redis:6379
    volumes: [uploads:/data/uploads]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: chatlol-web
    ports: ['${WEB_PORT:-8080}:80']
    depends_on: [api]

  coturn:
    profiles: [turn]
    image: coturn/coturn:4.6
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --tls-listening-port=5349
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-chatlol.app}
      - --no-cli
      - --fingerprint
      - --min-port=49160
      - --max-port=49200
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  mongodata:
  redisdata:
  uploads:
