# Security headers for every ChatLOL response. Kept in a snippet because nginx drops the server's add_header lines
# in any location that adds its own, so each location includes this again.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Camera and microphone are for live video; nothing else is allowed.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(self)" always;
