# Only for getting the first HTTPS certificate: nginx can't start the full config until the certificate exists.
# Enable this, run certbot, then swap it for chatlol.net.conf (see deploy/README.md).
server {
  listen 80;
  listen [::]:80;
  server_name chatlol.net www.chatlol.net turn.chatlol.net;
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 503;
  }
}
