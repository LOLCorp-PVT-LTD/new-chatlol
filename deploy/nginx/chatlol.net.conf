# ChatLOL on https://chatlol.net: the web app (static files) and the API (Node) on one server.
#
#   /                → the built Vue app: /var/www/chatlol/apps/web/dist (code checked out in /var/www/chatlol)
#   /api/            → the ChatLOL API (Node, 127.0.0.1:4510)
#   /socket.io/      → realtime (WebSocket, with long-polling fallback)
#   /uploads/        → uploaded photos, served straight from disk (not used if you set S3_BUCKET)
#
# Install:
#   sudo cp deploy/nginx/chatlol.net.conf /etc/nginx/sites-available/chatlol.net
#   sudo cp deploy/nginx/snippets/chatlol-headers.conf /etc/nginx/snippets/
#   sudo ln -s /etc/nginx/sites-available/chatlol.net /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d chatlol.net -d www.chatlol.net
#   sudo nginx -t && sudo systemctl reload nginx
# Full steps: deploy/README.md

# The ChatLOL API on port 4510 (systemd: chatlol-api@4510).
# For more capacity, start a second process (chatlol-api@4511) and uncomment its line. ip_hash keeps each visitor
# on the same process, which Socket.IO's long-polling fallback needs; the processes share messages through MongoDB.
upstream chatlol_api {
  ip_hash;
  server 127.0.0.1:4510 max_fails=3 fail_timeout=10s;
  # server 127.0.0.1:4511 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

map $http_upgrade $chatlol_connection_upgrade {
  default upgrade;
  ''      '';
}

# Sign-in, sign-up and password emails: a second line of defence behind the API's own limits.
limit_req_zone $binary_remote_addr zone=chatlol_auth:10m rate=20r/m;

# ——— http:// → https:// (and Let's Encrypt renewals) ———
server {
  listen 80;
  listen [::]:80;
  server_name chatlol.net www.chatlol.net;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://chatlol.net$request_uri;
  }
}

# ——— www.chatlol.net → chatlol.net ———
server {
  # Works on every nginx; on 1.25.1+ you may swap it for "listen 443 ssl;" plus "http2 on;" to silence a warning.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.chatlol.net;

  ssl_certificate     /etc/letsencrypt/live/chatlol.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chatlol.net/privkey.pem;

  return 301 https://chatlol.net$request_uri;
}

# ——— the site ———
server {
  # Works on every nginx; on 1.25.1+ you may swap it for "listen 443 ssl;" plus "http2 on;" to silence a warning.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name chatlol.net;

  ssl_certificate     /etc/letsencrypt/live/chatlol.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chatlol.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:chatlol_ssl:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Only the built web app. Never point this at the checkout itself: that would serve the source code and .env.
  root /var/www/chatlol/apps/web/dist;
  index index.html;

  # Photos and videos are up to 12 MB.
  client_max_body_size 13m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  include snippets/chatlol-headers.conf;

  access_log /var/log/nginx/chatlol.access.log;
  error_log  /var/log/nginx/chatlol.error.log warn;

  # ——— API ———
  location /api/ {
    proxy_pass http://chatlol_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI replies and uploads can take a while.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    # Uploads go straight through to the API instead of being buffered to disk first.
    proxy_request_buffering off;
  }

  location ~ ^/api/auth/(login|register|password/forgot|password/reset|verify/resend)$ {
    limit_req zone=chatlol_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://chatlol_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ——— realtime ———
  location /socket.io/ {
    proxy_pass http://chatlol_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $chatlol_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Socket.IO pings every 25 s, so a quiet connection is never cut.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  # ——— uploads, straight from disk (must match UPLOAD_DIR in the API's .env) ———
  # ^~ so images here never fall through to the icon rule below (regex locations otherwise win).
  location ^~ /uploads/ {
    alias /var/lib/chatlol/uploads/;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    # Uploaded files are only ever shown as images or video, never run as pages or scripts.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    include snippets/chatlol-headers.conf;
    try_files $uri =404;
  }

  # ——— the web app ———
  # Built files have a hash in their name, so they can be cached forever.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/chatlol-headers.conf;
    try_files $uri =404;
  }

  # The service worker (web push notifications) and the app manifest must always be fresh.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    include snippets/chatlol-headers.conf;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include snippets/chatlol-headers.conf;
    try_files $uri =404;
  }

  # Icons and brand images.
  location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=604800" always;
    include snippets/chatlol-headers.conf;
    try_files $uri =404;
  }

  # Every other path is a page in the app (/u/someone, /messages/…, /admin…): serve index.html and let the app route it.
  # index.html itself is never cached, so a new deploy shows up on the next page load.
  location / {
    add_header Cache-Control "no-cache" always;
    include snippets/chatlol-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
