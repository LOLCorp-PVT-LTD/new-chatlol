# coturn for ChatLOL live video (turn.chatlol.net). Copy to /etc/turnserver.conf.
# Steps: deploy/README.md, "Live video relay (TURN)".

# Ports: 3478 (UDP + TCP) for turn:, 5349 (TCP) for turns: (TLS, gets through strict firewalls).
listening-port=3478
tls-listening-port=5349

# Relayed media uses these UDP ports. Open the same range in the firewall.
min-port=49160
max-port=49200

# This server's public IP. Needed when the server is behind NAT (AWS, GCP, some clouds); harmless otherwise.
# external-ip=203.0.113.10

realm=turn.chatlol.net
server-name=turn.chatlol.net

# Short-lived logins made by the ChatLOL API. Must equal TURN_SECRET in /etc/chatlol/api.env.
use-auth-secret
static-auth-secret=CHANGE_ME_TO_THE_SAME_VALUE_AS_TURN_SECRET

# TLS for turns: (Let's Encrypt certificate for turn.chatlol.net, copied here by the certbot deploy hook).
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-multicast-peers
# Don't let the relay reach this server or private networks (stops it being used to probe your internal services).
# (Loopback is already blocked by default in coturn 4.6+.)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits per user and overall (a live stream with 12 viewers is roughly 12 relayed sessions at most).
user-quota=24
total-quota=600
stale-nonce=600

log-file=/var/log/turnserver/turnserver.log
simple-log
