name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_MONGODB_URL: mongodb://localhost:27017/?replicaSet=rs0
      TEST_REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start MongoDB (single-node replica set, for transactions)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)" && break
            sleep 2
          done
      - name: Typecheck frontends / syntax-check backend
        run: npm run typecheck && npm run check
      - name: Tests (MongoDB + Redis, incl. 2-instance cluster test)
        run: npm test
      - name: Server tests without Redis on an embedded MongoDB
        run: npm test -w @chatlol/server
        env: { TEST_MONGODB_URL: '', TEST_REDIS_URL: '' }
      - name: Build web
        run: npm run build -w @chatlol/web
      - name: Bundle native app (web + iOS + Android JS bundles)
        working-directory: apps/native
        run: npx expo export --platform web --platform ios --platform android --output-dir /tmp/native-export

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t chatlol-api .
      - run: docker build -f apps/web/Dockerfile -t chatlol-web .
