name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/chatlol_test
      TEST_REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: chatlol_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Tests (Postgres + Redis, incl. 2-instance cluster test)
        run: pnpm -r test
      - name: Server tests on SQLite
        run: pnpm --filter @chatlol/server test
        env: { TEST_DATABASE_URL: '', TEST_REDIS_URL: '' }
      - name: Build web
        run: pnpm --filter @chatlol/web build
      - name: Bundle native app (web + iOS + Android JS bundles)
        working-directory: apps/native
        run: npx expo export --platform web --platform ios --platform android --output-dir /tmp/native-export

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t chatlol-api .
      - run: docker build -f apps/web/Dockerfile -t chatlol-web .
